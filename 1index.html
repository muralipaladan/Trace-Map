<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ente Bhoomi Map with Live GPS</title>
    
    <!-- MapLibre CSS & JS -->
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    
    <style>
        body { margin: 0; padding: 0; }
        /* മാപ്പ് സ്ക്രീനിൽ പൂർണ്ണമായി കാണിക്കാൻ */
        #map { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // നിങ്ങളുടെ എന്റെ ഭൂമി auth_key ഇവിടെ നൽകിയിട്ടുണ്ട്
        const AUTH_KEY = "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiI5Y2M4YmRlZC1iNWU1LTQ3Y2EtYTM2My1lODllYzVlZDYxNDEiLCJpYXQiOjE3ODM1OTk3ODUsImV4cCI6MTc4MzYyODU4NX0.Vx1FVLGcxCzGa3P2cOyMJ6zwnX2k8iBRv1LIjnnyLvlsi4CE2NFNYac0fKuhpNapkB27lV1mD-xpjxVsl4G4eg";
        
        // CORS പ്രശ്നം ഒഴിവാക്കാനുള്ള പ്രോക്സി ലിങ്ക്
        const PROXY_URL = "https://cors-anywhere.herokuapp.com/";
        
        // ഗവൺമെന്റ് വെബ്സൈറ്റിൽ നിന്നുള്ള മാപ്പ് ലിങ്ക്
        const TILE_URL = `https://survey.entebhoomi.kerala.gov.in/bhunaksha/core/v1/tilemap/MAP_DASHBOARD/000000/{z}/{x}/{y}.pbf?auth_key=${AUTH_KEY}`;

        var map = new maplibregl.Map({
            container: 'map',
            center: [76.224, 11.233], // നിലമ്പൂർ പ്രദേശത്തെ കോർഡിനേറ്റ്സ്
            zoom: 14,
            style: {
                'version': 8,
                'sources': {
                    // 1. ഗൂഗിൾ ഹൈബ്രിഡ് ബേസ് മാപ്പ്
                    'google-map': {
                        'type': 'raster',
                        'tiles': [
                            'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'
                        ],
                        'tileSize': 256
                    },
                    // 2. എന്റെ ഭൂമി വെക്റ്റർ മാപ്പ് (പ്രോക്സി വഴിയുള്ളത്)
                    'entebhoomi-vector': {
                        'type': 'vector',
                        'tiles': [
                            PROXY_URL + TILE_URL
                        ]
                    }
                },
                'layers': [
                    // ഗൂഗിൾ മാപ്പ് ലെയർ
                    {
                        'id': 'google-layer',
                        'type': 'raster',
                        'source': 'google-map',
                        'minzoom': 0,
                        'maxzoom': 22
                    },
                    // എന്റെ ഭൂമി അതിരുകൾ വരയ്ക്കാനുള്ള ലെയർ
                    {
                        'id': 'entebhoomi-lines',
                        'type': 'line',
                        'source': 'entebhoomi-vector',
                        // ലെയറിന്റെ പേര് 'plot' ആണെന്ന് കരുതുന്നു. ഇത് തെറ്റാണെങ്കിൽ മഞ്ഞ വരകൾ വരില്ല.
                        'source-layer': 'plot', 
                        'paint': {
                            'line-color': '#FFFF00', // മഞ്ഞ നിറം
                            'line-width': 2
                        }
                    }
                ]
            }
        });

        // ലൈവ് GPS ട്രാക്കിംഗ് കോഡ്
        var geolocate = new maplibregl.GeolocateControl({
            positionOptions: {
                enableHighAccuracy: true
            },
            trackUserLocation: true,
            showUserHeading: true
        });
        
        map.addControl(geolocate);

        // മാപ്പ് ലോഡ് ആകുമ്പോൾ ലൊക്കേഷൻ പെർമിഷൻ ചോദിക്കാൻ
        map.on('load', function() {
            geolocate.trigger();
        });
    </script>
</body>
</html>
